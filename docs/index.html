<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毎日の短編小説ポッドキャスト</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem;
    line-height: 1.8;
    color: #222;
    background: #fafafa;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
  }
  h2 {
    font-size: 1.1rem;
    margin: 0 0 0.3rem;
  }
  p {
    color: #444;
  }
  .rss-link {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.6rem 1.2rem;
    background: #ff6600;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
  }
  .rss-link:hover {
    background: #e65c00;
  }
  .placeholder {
    margin-top: 2.5rem;
    padding: 1rem;
    border-left: 4px solid #ccc;
    color: #777;
    font-size: 0.95rem;
  }
  .episodes {
    margin-top: 2.5rem;
  }
  .episode {
    padding: 1.2rem 0;
    border-bottom: 1px solid #e0e0e0;
  }
  .episode:last-child {
    border-bottom: none;
  }
  .episode-date {
    font-size: 0.85rem;
    color: #999;
    margin: 0 0 0.4rem;
  }
  .episode-description {
    font-size: 0.95rem;
    color: #444;
    margin: 0 0 0.8rem;
  }
  .episode audio {
    width: 100%;
  }
  footer {
    margin-top: 3rem;
    font-size: 0.8rem;
    color: #999;
  }
</style>
</head>
<body>
  <h1>毎日の短編小説ポッドキャスト</h1>
  <p>これはAIが毎日生成する短編小説をお届けするポッドキャストです。テキストと音声の両方で、日々新しい物語をお楽しみいただけます。</p>

  <a class="rss-link" href="./rss.xml">RSSフィードを購読</a>

  <div class="episodes" id="episodes">
    <div class="placeholder">エピソードを読み込み中です…</div>
  </div>

  <footer>
    &copy; 毎日の短編小説ポッドキャスト<br>
    音声: <a href="https://www.meimeihimari.com/" style="color:inherit;">VOICEVOX:冥鳴ひまり</a>
  </footer>

  <script>
    function formatDate(pubDateText) {
      var d = new Date(pubDateText);
      if (isNaN(d.getTime())) {
        return pubDateText;
      }
      return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
    }

    function textOf(item, tagName) {
      var el = item.getElementsByTagName(tagName)[0];
      return el ? el.textContent.trim() : "";
    }

    function renderEpisodes(items) {
      var container = document.getElementById("episodes");

      if (!items || items.length === 0) {
        container.innerHTML = '<div class="placeholder">現在準備中です。エピソードは近日公開予定です。</div>';
        return;
      }

      container.innerHTML = "";
      items.forEach(function (item) {
        var title = textOf(item, "title");
        var description = textOf(item, "description");
        var pubDate = textOf(item, "pubDate");
        var enclosure = item.getElementsByTagName("enclosure")[0];
        var audioUrl = enclosure ? enclosure.getAttribute("url") : "";

        var episodeEl = document.createElement("div");
        episodeEl.className = "episode";

        var titleEl = document.createElement("h2");
        titleEl.textContent = title;
        episodeEl.appendChild(titleEl);

        var dateEl = document.createElement("p");
        dateEl.className = "episode-date";
        dateEl.textContent = formatDate(pubDate);
        episodeEl.appendChild(dateEl);

        if (description) {
          var descEl = document.createElement("p");
          descEl.className = "episode-description";
          descEl.textContent = description;
          episodeEl.appendChild(descEl);
        }

        if (audioUrl) {
          var audioEl = document.createElement("audio");
          audioEl.setAttribute("controls", "");
          audioEl.src = audioUrl;
          episodeEl.appendChild(audioEl);
        }

        container.appendChild(episodeEl);
      });
    }

    function showFallback() {
      var container = document.getElementById("episodes");
      container.innerHTML = '<div class="placeholder">現在準備中です。エピソードは近日公開予定です。</div>';
    }

    fetch("./rss.xml")
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Failed to fetch rss.xml");
        }
        return response.text();
      })
      .then(function (text) {
        var parser = new DOMParser();
        var xml = parser.parseFromString(text, "application/xml");
        if (xml.querySelector("parsererror")) {
          throw new Error("Failed to parse rss.xml");
        }
        var items = Array.prototype.slice.call(xml.getElementsByTagName("item"));
        renderEpisodes(items);
      })
      .catch(function () {
        showFallback();
      });
  </script>
</body>
</html>
